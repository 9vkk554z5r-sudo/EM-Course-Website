{% extends "base.html" %}
{% block title %}编辑知识点{% endblock %}
{% block content %}
<div class="page-header"><h1>✏️ {{ _("编辑知识点", "Edit Knowledge Point") }}</h1>
<a href="{{ url_for('study') }}" class="btn btn-sm btn-outline">← {{ _("返回", "Back") }}</a></div>
<div class="card"><div class="card-body">
<form method="POST" action="{{ url_for('user_edit_knowledge', kp_id=kp.id) }}">
<div class="form-group"><label>{{ _("标题", "Title") }}</label><input type="text" name="title" value="{{ kp.title }}" required style="width:100%"></div>
<div class="form-group"><label>{{ _("难度", "Difficulty") }}</label>
<select name="difficulty" style="width:100%">
<option value="beginner" {% if kp.difficulty=='beginner' %}selected{% endif %}>{{ _("初级", "Beginner") }}</option>
<option value="intermediate" {% if kp.difficulty=='intermediate' %}selected{% endif %}>{{ _("中级", "Intermediate") }}</option>
<option value="advanced" {% if kp.difficulty=='advanced' %}selected{% endif %}>{{ _("高级", "Advanced") }}</option>
</select></div>
<div class="form-group"><label>{{ _("分类", "Category") }}</label><input type="text" name="category" value="{{ kp.category }}" style="width:100%"></div>
<div class="form-group"><label>{{ _("内容", "Content") }}</label><textarea name="content" rows="10" required style="width:100%">{{ kp.content }}</textarea></div>
<div style="margin-top:12px"><button type="submit" class="btn btn-primary">{{ _("保存修改", "Save Changes") }}</button></div>
</form></div></div>
{% endblock %}
