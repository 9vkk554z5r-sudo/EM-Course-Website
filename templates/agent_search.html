{% extends "base.html" %}
{% block title %}文献助手{% endblock %}
{% block content %}
<div class="page-header">
    <h1>🤖 AI 文献助手</h1>
    <p class="text-muted">使用管理员配置的默认模型回答问题；精确论文与引用关系请使用 OpenAlex 文献星云。</p>
</div>
<div class="card">
    <div class="card-header"><h2>提问</h2></div>
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-group">
                <textarea name="query" rows="4" placeholder="例如：解释冷冻电镜中 CTF 校正的基本原理" required>{{ query }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">发送</button>
        </form>
    </div>
</div>
{% if result %}
<div class="card">
    <div class="card-header"><h2>{{ _("回答", "Answer") }}</h2></div>
    <div class="card-body"><div class="report-content" id="reportContent">{{ result }}</div></div>
</div>
{% endif %}
<style>
.report-content li { margin:4px 0; }
.report-content code { background:rgba(59,130,246,0.15); padding:2px 6px; border-radius:4px; font-size:0.9em; color:#93c5fd; }
.report-content pre { background:rgba(10,15,36,0.8); border:1px solid rgba(59,130,246,0.2); border-radius:8px; padding:12px 16px; overflow-x:auto; margin:10px 0; }
.report-content pre code { background:none; padding:0; color:#e0e0e0; }
.report-content p { margin:8px 0; }
.report-content br + br { display:block; content:""; margin:6px 0; }
</style>
<script>
function md2html(text) {
    if(!text) return "";
    return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/^### (.+)$/gm, "<h5>$1</h5>")
        .replace(/^## (.+)$/gm, "<h4>$1</h4>")
        .replace(/^# (.+)$/gm, "<h3>$1</h3>")
        .replace(/^- (.+)$/gm, "\u2022 $1")
        .replace(/\n\n/g, "<br><br>")
        .replace(/\n/g, "<br>");
}
document.addEventListener("DOMContentLoaded", function(){
    var el = document.getElementById("reportContent");
    if(el) { el.innerHTML = md2html(el.textContent); }
});
</script>
<div class="card">
    <div class="card-header"><h2>回答</h2></div>
    <div class="card-body"><div class="knowledge-content" style="white-space:pre-wrap">{{ result }}</div></div>
</div>
{% endblock %}
