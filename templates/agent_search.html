{% extends "base.html" %}
{% block title %}AI 文献助手{% endblock %}
{% block content %}
<div class="page-header">
    <h1>🤖 AI 文献助手</h1>
    <p class="text-muted">使用管理员配置的默认模型回答问题；精确论文与引用关系请使用 OpenAlex 文献星云。</p>
</div>
<div class="card">
    <div class="card-header"><h2>提问</h2></div>
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-group">
                <textarea name="query" rows="4" placeholder="例如：解释冷冻电镜中 CTF 校正的基本原理" required>{{ query }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">发送</button>
        </form>
    </div>
</div>
{% if result %}
<div class="card">
    <div class="card-header"><h2>回答</h2></div>
    <div class="card-body"><div class="knowledge-content" style="white-space:pre-wrap">{{ result }}</div></div>
</div>
{% endif %}
{% endblock %}
