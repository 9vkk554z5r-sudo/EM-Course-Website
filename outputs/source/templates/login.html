{% extends "base.html" %}
{% block title %}登录 — 电子显微学前沿课程{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🔬</div>
            <h1>电子显微学前沿课程</h1>
            <p>登录您的账号</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="student_id">学号</label>
                <input type="text" id="student_id" name="student_id" placeholder="请输入学号" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">登 录</button>
        </form>
        <div class="auth-footer">
            <p>还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
        </div>
    </div>
</div>
{% endblock %}
