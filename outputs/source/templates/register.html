{% extends "base.html" %}
{% block title %}注册 — 电子显微学前沿课程{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🔬</div>
            <h1>注册新账号</h1>
            <p>加入电子显微学前沿课程</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="student_id">学号</label>
                <input type="text" id="student_id" name="student_id" placeholder="请输入学号" required>
            </div>
            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" id="name" name="name" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" placeholder="用于接收文献推送" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="至少6位密码" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="再次输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">注 册</button>
        </form>
        <div class="auth-footer">
            <p>已有账号？<a href="{{ url_for('login') }}">立即登录</a></p>
        </div>
    </div>
</div>
{% endblock %}
